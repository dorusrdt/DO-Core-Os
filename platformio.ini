; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson@^6.21.3
	ayushsharma82/ElegantOTA@^3.1.5
	adafruit/RTClib@^2.1.4
	adafruit/Adafruit BME280 Library@^2.2.2

	links2004/WebSockets@^2.7.1
build_flags =
	-DCONFIG_FREERTOS_HZ=1000
	-Os
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ARDUHAL_LOG_COLORS=0
	-DCONFIG_ESP32_WIFI_TX_BUFFER_TYPE=1
	-DCONFIG_ESP32_WIFI_SOFTAP_SAE_SUPPORT=0
	-DCONFIG_ESP32_WIFI_ENABLE_WPA3_SAE=0
	-DCONFIG_ESP32_WIFI_11B_SUPPORT=0
	-DCONFIG_ESP32_WIFI_11G_SUPPORT=0
	-DCONFIG_ESP32_WIFI_11N_SUPPORT=0
	-DCONFIG_ESP32_WIFI_11AC_SUPPORT=0
	-DCONFIG_ESP32_WIFI_11AX_SUPPORT=0
	-DCONFIG_ESP32_PANIC_PRINT_REBOOT=1
