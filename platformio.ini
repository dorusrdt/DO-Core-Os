; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@3.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 

build_flags = 
    -DCONFIG_FREERTOS_HZ=1000
    -Os
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUHAL_LOG_COLORS=0
    ; Configuration WiFi ULTRA-MINIMALE pour économiser la mémoire
    -DCONFIG_ESP32_WIFI_TX_BUFFER_TYPE=1
    -DCONFIG_ESP32_WIFI_SOFTAP_SAE_SUPPORT=0
    -DCONFIG_ESP32_WIFI_ENABLE_WPA3_SAE=0
    -DCONFIG_ESP32_WIFI_11B_SUPPORT=0
    -DCONFIG_ESP32_WIFI_11G_SUPPORT=0
    -DCONFIG_ESP32_WIFI_11N_SUPPORT=0
    -DCONFIG_ESP32_WIFI_11AC_SUPPORT=0
    -DCONFIG_ESP32_WIFI_11AX_SUPPORT=0
    ; Optimisations supplémentaires pour réduire la Flash
    -DCONFIG_ESP32_PANIC_PRINT_REBOOT=1
    ; Configuration Module SST
    -DSST_MAX_ACCIDENTS=100
    -DSST_MAX_HISTORY_PERIODS=12
    -DSST_CONFIG_VERSION=1
    -DSST_STACK_SIZE=8192
    -DSST_UPDATE_INTERVAL=60000
    -DSST_AUTO_SAVE_INTERVAL=300000
    -DSST_MUTEX_TIMEOUT=1000

